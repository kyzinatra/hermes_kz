name: hermes-personal

services:
  hermes:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79}
        INSTALL_LOCAL_STT: ${INSTALL_LOCAL_STT:-true}
    image: hermes-personal:latest
    restart: unless-stopped
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_GATEWAY_NO_SUPERVISE: "1"
      TZ: ${TZ:-Asia/Vladivostok}
    volumes:
      - type: bind
        source: ./runtime
        target: /opt/data
        bind:
          create_host_path: false
      - ./config.yaml:/opt/data/config.yaml
      # Fail instead of silently creating a .env directory when the file is absent.
      - type: bind
        source: ./.env
        target: /opt/data/.env
        read_only: true
        bind:
          create_host_path: false
      - ./SOUL.md:/opt/data/SOUL.md
      - ./skills:/opt/data/custom-skills
      - ./memories:/opt/data/memories
      - ./knowledge:/opt/data/knowledge
      - ./plugins:/opt/data/plugins
      - ./credentials:/credentials:ro
      - ./backups:/backup
    shm_size: "1gb"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
