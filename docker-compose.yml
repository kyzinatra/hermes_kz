name: hermes-personal

services:
  hermes:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79}
        INSTALL_LOCAL_STT: ${INSTALL_LOCAL_STT:-true}
    image: hermes-personal:latest
    restart: unless-stopped
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      TZ: ${TZ:-Asia/Vladivostok}
    volumes:
      - ./runtime:/opt/data
      - ./config.yaml:/opt/data/config.yaml:ro
      # Secrets are read by Hermes from this file, not duplicated into the
      # container environment where `docker inspect` would expose them.
      - ./.env:/opt/data/.env:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro
      - ./skills:/opt/data/custom-skills:ro
      - ./memories:/opt/data/memories
      - ./knowledge:/opt/data/knowledge
      # Mount the parent read-only: leaving /opt/data/plugins writable would let
      # a compromised terminal session plant importable Python beside the plugins.
      - ./plugins:/opt/data/plugins:ro
      - ./credentials:/credentials:ro
      - ./backups:/backup
    shm_size: "1gb"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
