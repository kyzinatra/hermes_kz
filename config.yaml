model:
  provider: openai-codex
  default: gpt-5.6-sol
max_concurrent_sessions: 4
agent:
  max_turns: 160
  gateway_timeout: 3600
  api_max_retries: 3
  verify_on_stop: false
  gateway_timeout_warning: 1200
  reasoning_effort: medium
  verbose: false
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  home_mode: profile
web:
  search_backend: tavily-ddgs
  extract_backend: tavily-ddgs
  extract_char_limit: 15000
  keyless_fallback: false
  keyless_rescue: false
browser:
  # The Korea gateway permits only the reviewed built-in local Chrome stack.
  # Pin both selectors so saved/API credentials cannot auto-select a cloud
  # Browser Use or Browserbase provider for one instance.
  backend: off
  cloud_provider: local
  inactivity_timeout: 120
  allow_private_urls: false
  engine: chrome
  auto_local_for_private_urls: false
  allow_unsafe_evaluate: false
  restrict_evaluate: true
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
display:
  compact: true
  busy_input_mode: steer
  show_reasoning: false
  memory_notifications: verbose
  background_process_notifications: result
  interim_assistant_messages: true
  platforms:
    telegram:
      notifications: important
  tool_progress: new
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: false
tts:
  provider: nous
  edge:
    voice: ru-RU-DmitryNeural
    speed: 1.0
  openai:
    model: gpt-4o-mini-tts
    voice: cedar
    speed: 0.96
  speed: 1.0
stt:
  enabled: true
  language: ru
  local:
    model: base
    language: ru
    initial_prompt: Русская речь, имена, технические термины и англицизмы.
  provider: local
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: holographic
  flush_min_turns: 6
delegation:
  max_iterations: 40
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false
skills:
  external_dirs:
    - custom-skills
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 20
timezone: Asia/Vladivostok
approvals:
  destructive_slash_confirm: false
plugins:
  hermes-memory-store:
    db_path: /opt/data/memory_store.db
    auto_extract: false
    default_trust: 0.6
  enabled:
    - web/tavily-ddgs
    - korea
    - yandex-mail
  disabled: []
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: false
streaming:
  enabled: true
  transport: edit
  edit_interval: 4.0
  buffer_threshold: 96
onboarding:
  seen:
    busy_input_prompt: true
_config_version: 39
session_reset:
  mode: idle
  idle_minutes: 10080
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
    - korea
    - yandex_mail
  cron:
    - hermes-cron
    - korea
    - yandex_mail
    - no_mcp
  telegram:
    - hermes-telegram
    - korea
    - yandex_mail
    - no_mcp
known_plugin_toolsets:
  api_server:
    - korea
    - yandex_mail
  bluebubbles:
    - korea
    - yandex_mail
  cli:
    - korea
    - yandex_mail
  cron:
    - korea
    - yandex_mail
  dingtalk:
    - korea
    - yandex_mail
  discord:
    - korea
    - yandex_mail
  email:
    - korea
    - yandex_mail
  feishu:
    - korea
    - yandex_mail
  homeassistant:
    - korea
    - yandex_mail
  matrix:
    - korea
    - yandex_mail
  mattermost:
    - korea
    - yandex_mail
  qqbot:
    - korea
    - yandex_mail
  signal:
    - korea
    - yandex_mail
  slack:
    - korea
    - yandex_mail
  telegram:
    - korea
    - yandex_mail
  webhook:
    - korea
    - yandex_mail
  wecom:
    - korea
    - yandex_mail
  wecom_callback:
    - korea
    - yandex_mail
  weixin:
    - korea
    - yandex_mail
  whatsapp:
    - korea
    - yandex_mail
  whatsapp_cloud:
    - korea
    - yandex_mail
  yuanbao:
    - korea
    - yandex_mail
platforms:
  telegram:
    reply_to_mode: first
    guest_mode: false
    unauthorized_dm_behavior: ignore
    extra:
      disable_link_previews: true
      rich_messages: false
      rich_drafts: false
      command_menu:
        max_commands: 60
        priority_mode: prepend
      reactions: true
image_gen:
  provider: openai-codex
  model: gpt-image-2-medium
  openai-codex:
    model: gpt-image-2-medium
