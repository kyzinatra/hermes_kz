model:
  provider: openai-codex
  default: gpt-5.6-sol
max_concurrent_sessions: 4
agent:
  max_turns: 160
  gateway_timeout: 3600
  api_max_retries: 3
  verify_on_stop: false
  gateway_timeout_warning: 1200
  reasoning_effort: high
  verbose: false
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  home_mode: profile
web:
  search_backend: tavily-ddgs
  extract_backend: tavily-ddgs
  extract_char_limit: 15000
  # The composite provider owns every DDGS/Tavily decision. Disable Hermes'
  # outer rescue ring so it cannot bypass our intent/quality/cost policy.
  keyless_rescue: false
  keyless_fallback: false
browser:
  # Hermes defaults to the Browser Use CLI when this key is absent. `off`
  # explicitly selects the reviewed built-in browser_* implementation.
  backend: off
  inactivity_timeout: 120
  engine: chrome
  # Telegram has browser but deliberately has no terminal. The gateway adds a
  # mandatory connect-time filtering proxy; these upstream checks remain a
  # second layer and sensitive JS evaluation stays restricted.
  allow_private_urls: false
  auto_local_for_private_urls: false
  restrict_evaluate: true
  allow_unsafe_evaluate: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  progress_notices: false
display:
  compact: true
  busy_input_mode: steer
  show_reasoning: false
  memory_notifications: verbose
  interim_assistant_messages: true
  platforms:
    telegram:
      notifications: important
  tool_progress: new
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: false
  background_process_notifications: result
tts:
  provider: edge
  edge:
    voice: ru-RU-DmitryNeural
    speed: 1.0
  speed: 1.0
stt:
  enabled: true
  provider: local
  local:
    model: base
    language: ru
    initial_prompt: Русская речь, имена, технические термины и англицизмы.
  language: ru
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: holographic
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 40
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false
skills:
  # Version-controlled policy skills are exposed alongside the writable
  # Hermes-managed /opt/data/skills tree.
  external_dirs:
    - custom-skills
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 20
approvals:
  destructive_slash_confirm: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: false
streaming:
  enabled: true
  transport: edit
onboarding:
  seen:
    busy_input_prompt: true
# Schema of the pinned v2026.8.27 image. Keeping this explicit prevents its
# v37 migration from silently changing our intentional child-cost cap 3 -> 10.
_config_version: 39
plugins:
  hermes-memory-store:
    db_path: /opt/data/memory_store.db
    auto_extract: false
    default_trust: 0.6
  enabled:
    - web/tavily-ddgs
    - korea
    - yandex-mail
  disabled: []
session_reset:
  mode: idle
  idle_minutes: 10080
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
    - korea
    - yandex_mail
  cron:
    - hermes-cron
    - korea
    - yandex_mail
    - no_mcp
  telegram:
    # Personal bot: full first-party toolset plus reviewed local plugins.
    - hermes-telegram
    - korea
    - yandex_mail
    # MCP remains opt-in; local files, terminal, skills, cron and delegation are
    # provided by hermes-telegram and do not depend on MCP registration.
    - no_mcp
# Exact v2026.8.27 treats a plugin toolset as enabled on a platform until it
# has been seen there once. Record both custom plugins for every built-in
# platform so omission is always an explicit deny. Korea is then allowed only
# above for CLI/Telegram/cron.
known_plugin_toolsets:
  api_server:
    - korea
    - yandex_mail
  bluebubbles:
    - korea
    - yandex_mail
  cli:
    - korea
    - yandex_mail
  cron:
    - korea
    - yandex_mail
  dingtalk:
    - korea
    - yandex_mail
  discord:
    - korea
    - yandex_mail
  email:
    - korea
    - yandex_mail
  feishu:
    - korea
    - yandex_mail
  homeassistant:
    - korea
    - yandex_mail
  matrix:
    - korea
    - yandex_mail
  mattermost:
    - korea
    - yandex_mail
  qqbot:
    - korea
    - yandex_mail
  signal:
    - korea
    - yandex_mail
  slack:
    - korea
    - yandex_mail
  telegram:
    - korea
    - yandex_mail
  webhook:
    - korea
    - yandex_mail
  wecom:
    - korea
    - yandex_mail
  wecom_callback:
    - korea
    - yandex_mail
  weixin:
    - korea
    - yandex_mail
  whatsapp:
    - korea
    - yandex_mail
  whatsapp_cloud:
    - korea
    - yandex_mail
  yuanbao:
    - korea
    - yandex_mail
platforms:
  telegram:
    reply_to_mode: first
    guest_mode: false
    unauthorized_dm_behavior: ignore
    extra:
      disable_link_previews: true
      rich_messages: false
      rich_drafts: false
      command_menu:
        max_commands: 60
        priority_mode: prepend
      reactions: true
image_gen:
  provider: openai-codex
  model: gpt-image-2-medium
  openai-codex:
    model: gpt-image-2-medium
timezone: Asia/Vladivostok
